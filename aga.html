function linhasEscalas(){
  const out=[];
  BLOCOS.forEach(b=>(b.secoes||[]).forEach(sec=>{
    if(sec.tipo!=='escala') return;
    const sc=byId(sec.escala); if(!sc||!usada(sc)) return;
    const r=resultado(sc);
    out.push({bloco:b.titulo, sigla:sc.sigla, nome:sc.nome, txt:String(r.txt), lab:r.lab, cls:r.cls,
              conduta:(sc.conduta||{})[r.cls]||''});
  }));
  return out;
}
function hojeBR(){ const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear(); }
function assinatura(){
  const dt = dtBR(D('data_aval')) || hojeBR();
  const nm = D('medico') || 'Dr. Márcio Borges';
  const esp = D('especialidade') || 'Geriatria';
  const crm = D('crm') || 'CRM-SC 20861';
  const rqe = D('rqe') || 'RQE 12090';
  return '<div class="assin"><div class="dtl">'+esc(D('cidade')||'')+(D('cidade')?', ':'')+esc(dt)+'</div>'
    + '<div class="rub"></div>'
    + '<div class="nm">'+esc(nm)+'</div>'
    + '<div class="cr">'+esc(esp)+' &nbsp;·&nbsp; '+esc(crm)+' &nbsp;·&nbsp; '+esc(rqe)+'</div></div>';
}
function anotacoes(tit){
  return '<div class="anot nb"><div class="at">'+tit+'</div>'
   + '<div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>';
}
function laudo(){
  const s=sintese(), esc_=linhasEscalas();
  let h=cab('Laudo de Avaliação Geriátrica Ampla');
  h+='<div class="cx"><b>Diagnóstico funcional global:</b> '+esc(s.classe)+(s.complexidade?' — '+esc(s.complexidade):'')
   + '<br><span style="font-size:10pt">'+esc(s.detalhe)+'</span></div>';
  h+='<h2>Perfil funcional por domínio</h2><table><tbody>';
  [['AVD básicas',s.abvd],['AVD instrumentais',s.aivd],['Cognição',s.cognicao],['Humor',s.humor],
   ['Mobilidade e quedas',s.mobilidade],['Continência',s.continencia],['Comunicação e sensorial',s.comunicacao],
   ['Nutrição',s.nutricao],['Saúde bucal',s.bucal],['Sono',s.sono],['Suporte familiar',s.suporte_fam],
   ['Suporte social',s.suporte_soc],['Segurança ambiental',s.ambiente]].forEach(l=>{
    h+='<tr><th style="width:38%">'+esc(l[0])+'</th><td>'+esc(l[1])+'</td></tr>'; });
  h+='</tbody></table>';
  if(esc_.length){
    h+='<h2>Instrumentos aplicados</h2><table><thead><tr><th>Instrumento</th><th style="width:22%">Resultado</th><th style="width:34%">Interpretação</th></tr></thead><tbody>';
    esc_.forEach(e=>{ h+='<tr><td>'+esc(e.sigla)+' — '+esc(e.nome)+'</td><td>'+esc(e.txt)+'</td><td>'+esc(e.lab)+'</td></tr>'; });
    h+='</tbody></table>';
  }
  const meds=(state.tab['medicamentos']||[]).filter(m=>(m.farmaco||'').trim());
  if(meds.length){
    h+='<h2>Medicamentos em uso</h2><table><thead><tr><th>Fármaco</th><th>Dose</th><th>Tempo</th><th>Carga anticolinérgica</th><th>Riscos assinalados</th></tr></thead><tbody>';
    meds.forEach(m=>{
      const risc=[]; if(m.dopa)risc.push('antidopaminérgica'); if(m.sedativa)risc.push('sedativa');
      if(m.hipotensao)risc.push('hipotensão'); if(m.quedas)risc.push('quedas'); if(m.hipona)risc.push('hiponatremia'); if(m.qtc)risc.push('QTc');
      h+='<tr><td>'+esc(m.farmaco)+'</td><td>'+esc(m.dose)+'</td><td>'+esc(m.tempo)+'</td><td>'+esc(m.anticol||'0')+'</td><td>'+esc(risc.join(', '))+'</td></tr>';
    });
    h+='</tbody></table><div class="lin"><b>Carga anticolinérgica total:</b> '+s.acb.acb+' &nbsp;·&nbsp; <b>Total de medicamentos:</b> '+s.acb.n+'</div>';
  }
  if(D('lista_problemas')) h+='<h2>Lista de problemas</h2><div class="box">'+esc(D('lista_problemas')).replace(/\n/g,'<br>')+'</div>';
  h+='<div class="pb"></div><h2>Plano de cuidados</h2>';
  if(D('proporcionalidade')) h+='<h3>Proporcionalidade terapêutica</h3><div class="box">'+esc(D('proporcionalidade')).replace(/\n/g,'<br>')+'</div>';
  [['meta1','Prioridade 1 — reduzir declínio funcional e confortar'],
   ['meta2','Prioridade 2 — intervenções curativas ou modificadoras de doença'],
   ['meta3','Prioridade 3 — prevenção e fatores de risco']].forEach(m=>{
    if(D(m[0])) h+='<h3>'+m[1]+'</h3><div class="box">'+esc(D(m[0])).replace(/\n/g,'<br>')+'</div>'; });
  const presc=(state.tab['prescricao']||[]).filter(p=>(p.medicamento||'').trim());
  if(presc.length){
    h+='<h3>Tratamento farmacológico proposto</h3><table><thead><tr><th>Medicamento</th><th>Horário</th><th>Via</th><th>Dose</th><th>Orientações</th></tr></thead><tbody>';
    presc.forEach(p=>{ h+='<tr><td>'+esc(p.medicamento)+'</td><td>'+esc(p.horario)+'</td><td>'+esc(p.via)+'</td><td>'+esc(p.dose)+'</td><td>'+esc(p.orientacoes)+'</td></tr>'; });
    h+='</tbody></table>';
  }
  if(D('nao_farmaco')) h+='<h3>Tratamento não farmacológico e cuidado familiar</h3><div class="box">'+esc(D('nao_farmaco')).replace(/\n/g,'<br>')+'</div>';
  const reab=Object.keys(state.chk['reabilitacao']||{}).filter(k=>state.chk['reabilitacao'][k]);
  if(reab.length) h+='<h3>Encaminhamentos para equipe interdisciplinar</h3><div class="lin">'+esc(reab.join(' · '))+'</div>';
  [['especialidades','Especialidades médicas'],['propedeutica','Propedêutica complementar'],['retorno','Acompanhamento longitudinal']].forEach(x=>{
    if(D(x[0])) h+='<div class="lin"><b>'+x[1]+':</b> '+esc(D(x[0]))+'</div>'; });
  if(D('obs_laudo')) h+='<h3>Considerações do médico assistente</h3><div class="box">'+esc(D('obs_laudo')).replace(/\n/g,'<br>')+'</div>';
  h+=anotacoes('Anotações');
  h+=assinatura();
  h+='<div class="rod">Laudo de avaliação geriátrica ampla, de caráter multidimensional, elaborado conforme o protocolo de avaliação multidimensional da pessoa idosa (Moraes &amp; Lanna). Documento técnico destinado ao prontuário e à comunicação entre profissionais.</div>';
  return h;
}

  const nome=(D('nome')||'').split(' ')[0]||'';
  let h=cab('Resultado da sua Avaliação Geriátrica');
  h+='<div class="lin">'+(nome?esc(nome)+', e':'E')+'ste é o resumo da avaliação que fizemos hoje. Ela olha para várias áreas da sua saúde ao mesmo tempo — não só as doenças, mas também memória, humor, equilíbrio, alimentação, sono, medicamentos e o apoio que você tem em casa.</div>';
  const bom=[], atencao=[];
  const mapa=[['Autonomia no dia a dia',s.abvd,'Independente'],['Atividades fora de casa',s.aivd,'Independente'],
   ['Memória e raciocínio',s.cognicao,'Preservada'],['Humor',s.humor,'Sem indícios de depressão'],
   ['Equilíbrio e caminhada',s.mobilidade,'Preservada'],['Controle da urina',s.continencia,'Continente'],
   ['Visão e audição',s.comunicacao,'Sem déficit relevante'],['Alimentação e peso',s.nutricao,'Estado nutricional normal'],
   ['Saúde da boca',s.bucal,'Saúde bucal satisfatória'],['Sono',s.sono,'Sem transtorno do sono aparente'],
   ['Apoio da família',s.suporte_fam,'Suporte familiar adequado'],['Condições de vida e apoio social',s.suporte_soc,'Suporte social adequado'],
   ['Segurança da casa',s.ambiente,'Ambiente seguro']];
  mapa.forEach(m=>{ if(m[1]==='—') return; (m[1]===m[2]? bom:atencao).push(m); });
  if(bom.length){
    h+='<h2>O que está bem</h2><ul>'+bom.map(m=>'<li><b>'+esc(m[0])+'</b></li>').join('')+'</ul>';
  }
  if(atencao.length){
    h+='<h2>O que merece atenção</h2><ul>'+atencao.map(m=>'<li><b>'+esc(m[0])+':</b> '+esc(amigo(m[1]))+'</li>').join('')+'</ul>'
     + '<div class="lin" style="font-size:10pt">Nenhum desses pontos é motivo para desânimo: todos têm o que fazer, e é exatamente por isso que fizemos esta avaliação.</div>';
  }
  const acb=s.acb;
  if(acb.n) h+='<h2>Seus medicamentos</h2><div class="lin">Você usa <b>'+acb.n+'</b> medicamento(s) por dia.'
    + (acb.acb>=3? ' Alguns deles, somados, podem afetar a memória, o equilíbrio e aumentar o risco de queda. Vamos revisar essa lista com calma.' : '')
    + ' Traga sempre as caixas nas próximas consultas, inclusive de chás, pomadas, colírios e vitaminas.</div>';
  const orient=[];
  if(D('meta1')) orient.push(D('meta1'));
  if(D('nao_farmaco')) orient.push(D('nao_farmaco'));
  if(orient.length){
    h+='<h2>O que combinamos</h2>'+orient.map(o=>'<div class="destaque">'+esc(o).replace(/\n/g,'<br>')+'</div>').join('');
  }
  const presc=(state.tab['prescricao']||[]).filter(p=>(p.medicamento||'').trim());
  if(presc.length){
    h+='<h2>Seus remédios a partir de hoje</h2><table><thead><tr><th>Remédio</th><th>Quando tomar</th><th>Dose</th><th>Observações</th></tr></thead><tbody>';
    presc.forEach(p=>{ h+='<tr><td>'+esc(p.medicamento)+'</td><td>'+esc(p.horario)+'</td><td>'+esc(p.dose)+'</td><td>'+esc(p.orientacoes)+'</td></tr>'; });
    h+='</tbody></table>';
  }
  const reab=Object.keys(state.chk['reabilitacao']||{}).filter(k=>state.chk['reabilitacao'][k]);
  if(reab.length) h+='<h2>Profissionais que vão acompanhar você</h2><div class="lin">'+esc(reab.join(' · '))+'</div>';
  if(D('retorno')) h+='<h2>Próximo passo</h2><div class="lin">'+esc(D('retorno'))+'</div>';
  if(D('obs_paciente')) h+='<h2>Recado do seu médico</h2><div class="destaque">'+esc(D('obs_paciente')).replace(/\n/g,'<br>')+'</div>';
  h+=anotacoes('Anotações e orientações escritas na consulta');
  h+=assinatura();
  h+='<div class="rod">Este resumo é seu. Guarde-o e leve nas próximas consultas, inclusive com outros profissionais. Em caso de dúvida sobre qualquer orientação, procure a equipe antes de mudar por conta própria.</div>';
  return h;
}
function renderImp(){
  let h='<div class="head"><h2>Imprimir</h2><p>Duas saídas, ambas com nome e idade no cabeçalho. Use a impressão do navegador (Command + P) e escolha "Salvar como PDF" se quiser guardar no prontuário.</p></div>';
  const falta=[];
  if(!D('nome')) falta.push('nome do paciente');
  if(!D('idade')) falta.push('idade');
  if(falta.length) h+='<div class="alerta">Preencha '+falta.join(' e ')+' no bloco de Identificação — esses campos vão no cabeçalho dos dois documentos.</div>';
  h+='<div class="dg"><div class="card"><b>Relatório do paciente</b><div style="color:var(--dim);font-size:13.5px;margin-top:6px">Linguagem acessível, com o que está bem, o que merece atenção, os remédios e o que foi combinado. É o que o paciente leva para casa.</div>'
   + '<div class="acts"><button class="btn p" id="imp-rel">Imprimir relatório do paciente</button><button class="btn" id="prev-rel">Pré-visualizar</button></div></div>'
   + '<div class="card"><b>Laudo técnico da AGA</b><div style="color:var(--dim);font-size:13.5px;margin-top:6px">Diagnóstico funcional global, perfil por domínio, todos os instrumentos aplicados, medicamentos e plano de cuidados. Para o prontuário, o plano de saúde e os demais profissionais.</div>'
   + '<div class="acts"><button class="btn p" id="imp-lau">Imprimir laudo técnico</button><button class="btn" id="prev-lau">Pré-visualizar</button></div></div>'
   + '<div class="card"><b>Dados da avaliação</b><div style="color:var(--dim);font-size:13.5px;margin-top:6px">Nada é enviado para servidor algum: tudo vive apenas nesta aba. Baixe o arquivo se quiser guardar ou continuar depois em outro computador.</div>'
   + '<div class="acts"><button class="btn" id="exp">Baixar dados (.json)</button><label class="btn" style="cursor:pointer">Carregar dados<input type="file" id="imp" accept="application/json" style="display:none"></label><button class="btn" id="zerar">Nova avaliação</button></div></div></div>';
  h+='<div id="preview" style="margin-top:20px"></div>';
  $('#work').innerHTML=h;
  const põe = fn => { $('#print').innerHTML = fn(); };
  $('#imp-rel').onclick=()=>{ põe(relatorio); window.print(); };
  $('#imp-lau').onclick=()=>{ põe(laudo); window.print(); };
  $('#prev-rel').onclick=()=>{ $('#preview').innerHTML='<div class="pv">'+relatorio()+'</div>'; };
  $('#prev-lau').onclick=()=>{ $('#preview').innerHTML='<div class="pv">'+laudo()+'</div>'; };
  $('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({dados:state.dados,resp:state.resp,extras:state.extras,tab:state.tab,chk:state.chk,over:state.over},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='AGA_'+((D('nome')||'paciente').replace(/[^\wÀ-ú]+/g,'_'))+'.json'; a.click();
  };
  $('#imp').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ const j=JSON.parse(r.result);
      state.dados=j.dados||{}; state.resp=j.resp||{}; state.extras=j.extras||{};
      state.tab=j.tab||{}; state.chk=j.chk||{}; state.over=j.over||{};
      Object.keys(PADRAO).forEach(k=>{ if(!state.dados[k]) state.dados[k]=PADRAO[k]; });
      toast('avaliação carregada'); render(); }catch(err){ toast('arquivo inválido'); } };
    r.readAsText(f);
  };
  $('#zerar').onclick=()=>{ if(confirm('Apagar todos os dados desta avaliação?')){
    state.dados=Object.assign({}, PADRAO); state.resp={}; state.extras={}; state.tab={}; state.chk={}; state.over={}; render(); } };
}

/* ---------- eventos ---------- */
function bind(){
  const w=$('#work');
  w.querySelectorAll('[data-k]').forEach(el=> el.oninput=el.onchange=()=>{
    state.dados[el.dataset.k]=el.value;
    if(el.dataset.k==='nascimento' && el.value){
      const n=new Date(el.value), h=new Date();
      let a=h.getFullYear()-n.getFullYear();
      const m=h.getMonth()-n.getMonth();
      if(m<0 || (m===0 && h.getDate()<n.getDate())) a--;
      if(a>0 && a<130){ state.dados['idade']=String(a);
        const ci=$('#work').querySelector('[data-k="idade"]'); if(ci) ci.value=String(a); }
    }
    if(['nome','idade','nascimento'].includes(el.dataset.k)) atualizaPac();
    if(['peso','altura'].includes(el.dataset.k)){ const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; }
    renderList();
  });
  w.querySelectorAll('[data-tog]').forEach(el=> el.onclick=()=>{
    const id=el.dataset.tog; state.aberta[id]=!state.aberta[id];
    const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; });
  w.querySelectorAll('[data-op]').forEach(el=> el.onclick=()=>{
    const [id,i,v]=el.dataset.op.split('|');
    state.resp[id]=state.resp[id]||{};
    const nv=parseFloat(v); state.resp[id][+i] = state.resp[id][+i]===nv? undefined : nv;
    const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; renderList(); });
  w.querySelectorAll('[data-in]').forEach(el=> el.oninput=()=>{
    const [id,i]=el.dataset.in.split('|');
    state.resp[id]=state.resp[id]||{};
    const v=parseFloat(el.value); state.resp[id][+i]= isNaN(v)? undefined:v;
    const y=w.scrollTop, p=el.selectionStart; renderBloco(); bind(); w.scrollTop=y;
    const n=w.querySelector('[data-in="'+el.dataset.in+'"]'); if(n){n.focus(); try{n.setSelectionRange(p,p)}catch(e){}}
    renderList(); });
  w.querySelectorAll('[data-ex]').forEach(el=> el.onchange=()=>{
    const [id,c]=el.dataset.ex.split('|');
    state.extras[id]=state.extras[id]||{}; state.extras[id][c]=el.value||undefined;
    const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; });
  w.querySelectorAll('[data-limpa]').forEach(el=> el.onclick=()=>{
    const id=el.dataset.limpa; state.resp[id]={}; state.extras[id]={};
    const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; renderList(); });
  w.querySelectorAll('[data-tt]').forEach(el=> el.oninput=()=>{
    const [k,i,c]=el.dataset.tt.split('|');
    state.tab[k]=state.tab[k]||[{}]; state.tab[k][+i]=state.tab[k][+i]||{}; state.tab[k][+i][c]=el.value;
    if(k==='medicamentos'){ const box=w.querySelector('.acb-box'); if(box){ const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y;
      const n=w.querySelector('[data-tt="'+el.dataset.tt+'"]'); if(n) n.focus(); } } });
  w.querySelectorAll('[data-ts]').forEach(el=> el.onchange=()=>{
    const [k,i,c]=el.dataset.ts.split('|');
    state.tab[k]=state.tab[k]||[{}]; state.tab[k][+i]=state.tab[k][+i]||{}; state.tab[k][+i][c]=el.value;
    const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; });
  w.querySelectorAll('[data-tc]').forEach(el=> el.onclick=()=>{
    const [k,i,c]=el.dataset.tc.split('|');
    state.tab[k]=state.tab[k]||[{}]; state.tab[k][+i]=state.tab[k][+i]||{};
    state.tab[k][+i][c]=!state.tab[k][+i][c];
    const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; });
  w.querySelectorAll('[data-tadd]').forEach(el=> el.onclick=()=>{
    const k=el.dataset.tadd; state.tab[k]=state.tab[k]||[{}]; state.tab[k].push({});
    const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; });
  w.querySelectorAll('[data-trm]').forEach(el=> el.onclick=()=>{
    const [k,i]=el.dataset.trm.split('|');
    state.tab[k].splice(+i,1); if(!state.tab[k].length) state.tab[k]=[{}];
    const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; });
  w.querySelectorAll('[data-ck]').forEach(el=> el.onclick=()=>{
    const p=el.dataset.ck; const k=p.slice(0,p.indexOf('|')), it=p.slice(p.indexOf('|')+1);
    state.chk[k]=state.chk[k]||{}; state.chk[k][it]=!state.chk[k][it];
    const y=w.scrollTop; renderBloco(); bind(); w.scrollTop=y; });
  w.querySelectorAll('[data-ov]').forEach(el=> el.onchange=()=>{
    state.over[el.dataset.ov]=el.value||undefined; renderDiag(); bind(); });
}
function atualizaPac(){
  const n=D('nome'), i=D('idade');
  $('#pac').innerHTML = n? '<b>'+esc(n)+'</b>'+(i?' · '+esc(i)+' anos':'') : 'sem paciente';
}
let tt; function toast(m){ const e=$('#toast'); e.textContent=m; e.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('on'),1600); }

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===state.view));
  $('#side').style.display = state.view==='im'? 'none':'flex';
  renderList();
  if(state.view==='im') renderImp();
  else if(state.view==='dg'){ state.sel='diagnostico'; renderDiag(); }
  else if(state.view==='pl'){ state.sel='plano'; renderPlano(PLANO); }
  else { if(state.sel==='diagnostico'||state.sel==='plano') state.sel=BLOCOS[0].id; renderBloco(); }
  bind(); atualizaPac();
}
document.querySelectorAll('.tab').forEach(t=> t.onclick=()=>{ state.view=t.dataset.v; document.body.classList.remove('nav'); render(); });
$('#menu').onclick=()=> document.body.classList.toggle('nav');
const hh=()=>document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight+'px');
hh(); addEventListener('resize', hh); addEventListener('orientationchange', ()=>setTimeout(hh,120));
render();
</script></body></html>
