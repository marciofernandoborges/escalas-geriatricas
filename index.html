<style>
:root{
 --bg:#ffffff; --panel:#f6f8fb; --panel2:#eaeff6; --line:#d3dbe6; --ink:#16202b; --dim:#5d6b7d;
 --acc:#0c457a; --acc-soft:#e3edf8; --ok:#1a7a4d; --medio:#9a6a05; --alto:#b45a17; --critico:#b62222;
 --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:calc(12px + var(--sat)) 20px 12px;border-bottom:1px solid var(--line);background:#fff;flex:0 0 auto;box-shadow:0 1px 3px rgba(16,32,52,.05)}
header h1{margin:0;font-size:17px;letter-spacing:-.01em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
header .sub{color:var(--dim);font-size:12.5px;white-space:nowrap}
#menu{display:none;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:15px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:transparent;border:1px solid transparent;color:var(--dim);padding:7px 14px;border-radius:8px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--panel2);border-color:var(--line);color:var(--ink)}
main{flex:1;display:flex;min-height:0}
aside{width:310px;flex:0 0 310px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
.search{padding:12px}
.search input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
.list{overflow-y:auto;flex:1;padding:0 8px 24px;-webkit-overflow-scrolling:touch}
.dom{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;font-size:13px;text-transform:uppercase;letter-spacing:.055em;font-weight:800;background:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:9px 12px;margin:18px 2px 8px}
.dom:first-child{margin-top:10px}
.dom .n{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:0;color:#fff;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.42);border-radius:999px;padding:1px 8px}
.vazio{color:var(--dim);font-size:13.5px;padding:18px 12px;text-align:center}
.si{display:block;width:100%;text-align:left;background:transparent;border:0;padding:9px 10px;border-radius:8px;line-height:1.35}
.si:hover{background:var(--panel2)}
.si.on{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.si b{display:block;font-size:14px;font-weight:600}
.si span{color:var(--dim);font-size:12px}
.si.done b::after{content:" \2713";color:var(--ok)}
.si.tool b::before{content:"\2699  ";color:var(--acc)}
.drug{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.drug:hover{background:var(--panel2)}
.drug.on{background:var(--acc-soft)}
.drug .pt{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:7px;background:var(--panel2);font-weight:700;font-size:13px}
.drug.on .pt{background:var(--acc);color:#fff}
.drug .nm{flex:1;font-size:14.5px}
.drug .cl{color:var(--dim);font-size:12px}
.pill{display:inline-block;background:var(--acc);color:#fff;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.crit{border-bottom:1px solid var(--line);padding:13px 0}
.crit .rec{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.04em;padding:2px 9px;border-radius:6px;margin-bottom:6px}
.crit .rec.evitar{background:#fbe4e4;color:#8c1a1a}
.crit .rec.cautela{background:#fdf0dc;color:#7d5406}
.crit .rec.start{background:#e2f3ea;color:#14603b}
.crit .fx{font-weight:600;font-size:15px;margin-bottom:4px}
.crit .mt{color:#3a4757;font-size:13.6px}
.crit .tg{color:var(--dim);font-size:12px;margin-top:5px}
.filtro{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.filtro button{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 13px;font-size:12.5px}
@media (max-width:900px){.filtro button{padding:7px 11px;font-size:12px}.crit{padding:12px 0}}
.filtro button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
section.work{flex:1;overflow-y:auto;padding:24px 34px 40px;min-width:0;-webkit-overflow-scrolling:touch}
.head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:6px}
.head h2{margin:0 0 6px;font-size:23px;letter-spacing:-.02em;line-height:1.25}
.head .meta{color:var(--dim);font-size:13.5px}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--dim);margin:0 6px 4px 0}
.avalia{margin:14px 0 0;max-width:820px}
.nota{background:var(--acc-soft);border-left:3px solid var(--acc);padding:11px 14px;border-radius:0 8px 8px 0;font-size:13.5px;color:#243b52;margin:16px 0;max-width:820px}
.item{border-bottom:1px solid var(--line);padding:15px 0}
.item .q{margin-bottom:10px;max-width:900px}

eição completa", "o": [["0 Normal / nunca fez, mas faria", 0], ["1 Faz com dificuldade", 1], ["2 Precisa de ajuda", 2], ["3 Não é capaz", 3]]}, {"t": "Manter-se em dia com os acontecimentos e a comunidade", "o": [["0 Normal / nunca fez, mas faria", 0], ["1 Faz com dificuldade", 1], ["2 Precisa de ajuda", 2], ["3 Não é capaz", 3]]}, {"t": "Prestar atenção, entender e discutir um programa de TV, jornal ou revista", "o": [["0 Normal / nunca fez, mas faria", 0], ["1 Faz com dificuldade", 1], ["2 Precisa de ajuda", 2], ["3 Não é capaz", 3]]}, {"t": "Lembrar de compromissos, ocasiões familiares e feriados", "o": [["0 Normal / nunca fez, mas faria", 0], ["1 Faz com dificuldade", 1], ["2 Precisa de ajuda", 2], ["3 Não é capaz", 3]]}, {"t": "Manusear os próprios medicamentos", "o": [["0 Normal / nunca fez, mas faria", 0], ["1 Faz com dificuldade", 1], ["2 Precisa de ajuda", 2], ["3 Não é capaz", 3]]}, {"t": "Andar pela vizinhança e encontrar o caminho de volta", "o": [["0 Normal / nunca fez, mas faria", 0], ["1 Faz com dificuldade", 1], ["2 Precisa de ajuda", 2], ["3 Não é capaz", 3]]}, {"t": "Cumprimentar os amigos adequadamente", "o": [["0 Normal / nunca fez, mas faria", 0], ["1 Faz com dificuldade", 1], ["2 Precisa de ajuda", 2], ["3 Não é capaz", 3]]}, {"t": "Ficar sozinho em casa com segurança", "o": [["0 Normal / nunca fez, mas faria", 0], ["1 Faz com dificuldade", 1], ["2 Precisa de ajuda", 2], ["3 Não é capaz", 3]]}], "extra": []}, {"id": "tug", "nome": "Teste de Levantar e Caminhar Cronometrado", "sigla": "TUG", "dominio": "Mobilidade e quedas", "avalia": "Mobilidade funcional e risco de queda. Levantar da cadeira, andar 3 m, girar, voltar e sentar.", "tempo": "2 min", "faixa": [0, 60], "sentido": "maior_pior", "calc": "tug", "nota": "Cadeira com braços, altura ~46 cm. Paciente com calçado habitual e dispositivo de marcha usual. Cronometrar do comando “já” até sentar novamente.", "itens": [{"t": "Tempo para completar o percurso", "num": true, "min": 0, "max": 120, " ", "alto": "Moderada a grave — caracterizar o tipo (esforço, urgência, mista, transbordamento, funcional). Excluir causas reversíveis (delirium, infecção, atrofia vaginal, fármacos, excesso de líquidos, mobilidade restrita, fecaloma). Fisioterapia pélvica é primeira linha; antimuscarínicos exigem cautela pelo efeito anticolinérgico — preferir mirabegrona no idoso com risco cognitivo.", "critico": "Grave, com grande impacto — avaliação urológica/uroginecológica, medidas de proteção da pele e prevenção de úlcera."}, "fonte": "Acervo: 13 obras", "extra": [], "nota": ""}, {"id": "ivcf20", "nome": "Índice de Vulnerabilidade Clínico-Funcional 20", "sigla": "IVCF-20", "dominio": "Fragilidade", "avalia": "Instrumento brasileiro de rastreio multidimensional de fragilidade em 8 dimensões — idade, autopercepção de saúde, AVD, cognição, humor, mobilidade, comunicação e comorbidade múltipla. Recomendado na atenção primária no Brasil.", "tempo": "5–10 min", "faixa": [0, 40], "sentido": "maior_pior", "calc": "ivcf20", "nota": "Pode ser respondido pelo próprio idoso ou por familiar/cuidador. Atenção às pontuações-teto: as questões 3, 4 e 5 (AIVD) somam no máximo 4 pontos no conjunto; a questão 14 vale no máximo 2 pontos; a questão 20 vale no máximo 4 pontos. O app já aplica esses limites automaticamente.", "itens": [{"t": "1. IDADE — Qual é a sua idade?", "o": [["60 a 74 anos", 0], ["75 a 84 anos", 1], ["85 anos ou mais", 3]]}, {"t": "2. PERCEPÇÃO DA SAÚDE — Comparando com outras pessoas de sua idade, você diria que sua saúde é:", "o": [["Excelente, muito boa ou boa", 0], ["Regular ou ruim", 1]]}, {"t": "3. AIVD — Por causa de sua saúde ou condição física, você deixou de fazer compras?", "o": [["Não, ou não faz compras por outro motivo que não a saúde", 0], ["Sim", 4]]}, {"t": "4. AIVD — Por causa de sua saúde ou condição física, deixou de controlar seu dinheiro, gastos ou pagar as contas de casa?", "o": [["Não, ou não controla por outro motivo que não a saúde", 0], ["Sim", 4]]}, {"t": "5. AIVD — Por causa de sua saúde ou condição física, deixou de realizar pequenos trabalhos domésticos (lavar louça, arrumar a casa, limpeza leve)?", "o": [["Não, ou não faz por outro motivo que não a saúde", 0], ["Sim", 4]]}, {"t": "6. ABVD — Por causa de sua saúde ou condição física, você deixou de tomar banho sozinho?", "o": [["Não", 0], ["Sim", 6]]}, {"t": "7. COGNIÇÃO — Algum familiar ou amigo falou que você está ficando esquecido?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "8. COGNIÇÃO — Este esquecimento está piorando nos últimos meses?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "9. COGNIÇÃO — Este esquecimento está impedindo a realização de alguma atividade do cotidiano?", "o": [["Não", 0], ["Sim", 2]]}, {"t": "10. HUMOR — No último mês, você ficou com desânimo, tristeza ou desesperança?", "o": [["Não", 0], ["Sim", 2]]}, {"t": "11. HUMOR — No último mês, você perdeu o interesse ou prazer em atividades antes prazerosas?", "o": [["Não", 0], ["Sim", 2]]}, {"t": "12. MOBILIDADE — Você é incapaz de elevar os braços acima do nível do ombro?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "13. MOBILIDADE — Você é incapaz de manusear ou segurar pequenos objetos?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "14. MOBILIDADE — Tem alguma destas condições? Perda de peso não intencional (4,5 kg ou 5% no último ano, 6 kg em 6 meses ou 3 kg no último mês) · IMC < 22 kg/m² · circunferência da panturrilha < 31 cm · tempo no teste de marcha de 4 m > 5 s", "o": [["Nenhuma", 0], ["Uma ou mais (máximo 2 pontos)", 2]]}, {"t": "15. MARCHA — Você tem dificuldade para caminhar capaz de impedir a realização de alguma atividade do cotidiano?", "o": [["Não", 0], ["Sim", 2]]}, {"t": "16. QUEDAS — Você teve duas ou mais quedas no último ano?", "o": [["Não", 0], ["Sim", 2]]}, {"t": "17. CONTINÊNCIA — Você perde urina ou fezes, sem querer, em algum momento?", "o": [["Não", 0], ["Sim", 2]]}, {"t": "18. VISÃO — Tem problemas de visão capazes de impedir alguma atividade do cotidiano? (é permitido o uso de óculos ou lentes)", "o": [["Não", 0], ["Sim", 2]]}, {"t": "19. AUDIÇÃO — Tem problemas de audição capazes de impedir alguma atividade do cotidiano? (é permitido o uso de aparelho auditivo)", "o": [["Não", 0], ["Sim", 2]]}, {"t": "20. COMORBIDADE MÚLTIPLA — Tem alguma destas condições? Cinco ou mais doenças crônicas · uso regular de cinco ou mais medicamentos diferentes por dia · internação nos últimos 6 meses", "o": [["Nenhuma", 0], ["Uma ou mais (máximo 4 pontos)", 4]]}], "cortes": [[0, 6, "BAIXA vulnerabilidade — idoso robusto", "ok"], [7, 14, "MODERADA vulnerabilidade — risco de fragilização", "alto"], [15, 40, "ALTA vulnerabilidade — idoso frágil", "critico"]], "conduta": {"ok": "0–6: idoso robusto. Manter promoção de saúde e prevenção — atividade física regular, alimentação adequada, vacinação, rastreios conforme expectativa de vida. Reavaliar anualmente.", "alto": "7–14: risco de fragilização. Detalhar as dimensões alteradas com instrumentos específicos (MEEM, GDS-15, MNA, SPPB, velocidade de marcha) e intervir precocemente — exercício multicomponente, otimização nutricional, revisão da polifarmácia, correção de visão e audição. É a janela de maior retorno da intervenção.", "critico": "≥15: idoso frágil, alta vulnerabilidade clínico-funcional. Indica avaliação geriátrica ampla completa e plano de cuidados individualizado, com equipe interdisciplinar. Priorizar prevenção de queda, revisão criteriosa de medicamentos, suporte ao cuidador e adequação de metas terapêuticas. Encaminhamento para atenção especializada conforme a rede local."}, "fonte": "Manual de Avaliação Multidimensional da Pessoa Idosa para a APS — aplicações do IVCF-20 e do ICOPE (2023), p. 21", "extra": []}, {"id": "gds30", "nome": "Escala de Depressão Geriátrica — versão original de 30 itens", "sigla": "GDS-30", "dominio": "Humor", "avalia": "Versão completa de Yesavage. Mais longa que a GDS-15, mas com melhor gradação da gravidade.", "tempo": "10 min", "faixa": [0, 30], "sentido": "maior_pior", "calc": "soma", "nota": "Refere-se à ÚLTIMA SEMANA. Cada resposta na direção depressiva vale 1 ponto.", "itens": [{"t": "Está basicamente satisfeito com sua vida?", "o": [["Não", 1], ["Sim", 0]]}, {"t": "Deixou de lado muitas de suas atividades e interesses?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente que sua vida está vazia?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Aborrece-se com frequência?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente-se de bem com a vida na maior parte do tempo?", "o": [["Não", 1], ["Sim", 0]]}, {"t": "Teme que algo ruim lhe aconteça?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente-se feliz na maior parte do tempo?", "o": [["Não", 1], ["Sim", 0]]}, {"t": "Sente-se frequentemente desamparado?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Prefere ficar em casa a sair e fazer coisas novas?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente que tem mais problemas de memória que a maioria?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Acha maravilhoso estar vivo?", "o": [["Não", 1], ["Sim", 0]]}, {"t": "Sente-se inútil nas atuais circunstâncias?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente-se cheio de energia?", "o": [["Não", 1], ["Sim", 0]]}, {"t": "Sente que sua situação não tem saída?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Acha que a maioria das pessoas está melhor que você?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente-se frequentemente aborrecido?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente-se pouco à vontade em grupos?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Preocupa-se muito com o passado?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Acha a vida muito excitante?", "o": [["Não", 1], ["Sim", 0]]}, {"t": "É difícil começar novos projetos?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente-se cheio de disposição?", "o": [["Não", 1], ["Sim", 0]]}, {"t": "Sente que sua situação é sem esperança?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Acha que a maioria tem mais sorte que você?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Preocupa-se com coisas sem importância?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente frequentemente vontade de chorar?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Tem dificuldade de se concentrar?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "Sente prazer ao acordar de manhã?", "o": [["Não", 1], ["Sim", 0]]}, {"t": "Prefere evitar encontros sociais?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "É fácil para você tomar decisões?", "o": [["Não", 1], ["Sim", 0]]}, {"t": "Sua mente está tão clara quanto antes?", "o": [["Não", 1], ["Sim", 0]]}], "cortes": [[0, 10, "Sem depressão", "ok"], [11, 20, "Depressão leve a moderada", "medio"], [21, 30, "Depressão grave", "alto"]], "conduta": {"ok": "0–10: rastreio negativo.", "medio": "11–20: depressão leve a moderada — confirmar diagnóstico, investigar causas orgânicas e medicamentosas, iniciar psicoterapia e/ou ISRS, reavaliar em 2–4 semanas.", "alto": "≥21: depressão grave — avaliar ideação suicida imediatamente, risco nutricional e de desidratação, e necessidade de encaminhamento psiquiátrico urgente."}, "fonte": "Acervo: 53 obras (família GDS)", "extra": []}, {"id": "cage", "nome": "Questionário CAGE", "sigla": "CAGE", "dominio": "Outros", "avalia": "Rastreio clássico de uso problemático de álcool em 4 perguntas.", "tempo": "1 min", "faixa": [0, 4], "sentido": "maior_pior", "calc": "soma", "itens": [{"t": "C — Alguma vez sentiu que deveria diminuir (Cut down) a quantidade de bebida?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "A — As pessoas o aborrecem (Annoyed) porque criticam o seu modo de beber?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "G — Sente-se culpado (Guilty) pela maneira como costuma beber?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "E — Costuma beber pela manhã para diminuir o nervosismo ou a ressaca (Eye-opener)?", "o": [["Não", 0], ["Sim", 1]]}], "cortes": [[0, 1, "Rastreio negativo", "ok"], [2, 4, "Rastreio POSITIVO", "alto"]], "conduta": {"ok": "0–1: sem indício de uso problemático. Ainda assim, quantificar o consumo — no idoso, doses menores já causam dano.", "alto": "≥2: rastreio positivo para uso problemático de álcool. Quantificar o consumo (AUDIT), avaliar dependência e abstinência, rastrear quedas, delirium, desnutrição, hepatopatia e interações medicamentosas. Fazer intervenção breve e considerar encaminhamento."}, "fonte": "Acervo: 74 obras", "extra": [], "nota": ""}, {"id": "whooley", "nome": "Duas perguntas de Whooley", "sigla": "Whooley", "dominio": "Humor", "avalia": "Rastreio ultrarrápido de depressão — alta sensibilidade, ideal para triagem em consulta curta.", "tempo": "30 s", "faixa": [0, 2], "sentido": "maior_pior", "calc": "soma", "itens": [{"t": "No último mês, você se sentiu incomodado por estar para baixo, deprimido ou sem esperança?", "o": [["Não", 0], ["Sim", 1]]}, {"t": "No último mês, você se sentiu incomodado por ter pouco interesse ou prazer em fazer as coisas?", "o": [["Não", 0], ["Sim", 1]]}], "cortes": [[0, 0, "Rastreio negativo", "ok"], [1, 2, "Rastreio POSITIVO", "alto"]], "conduta": {"ok": "Ambas negativas: depressão improvável (alto valor preditivo negativo).", "alto": "Qualquer resposta positiva: aplicar GDS-15 ou PHQ-9 e conduzir avaliação diagnóstica."}, "fonte": "Acervo: 16 obras", "extra": [], "nota": ""}, {"id": "apgar_familiar", "nome": "APGAR de Família", "sigla": "APGAR familiar", "dominio": "Outros", "avalia": "Satisfação do paciente com o funcionamento da própria família — suporte familiar é determinante do cuidado do idoso.", "tempo": "3 min", "faixa": [0, 10], "sentido": "maior_melhor", "calc": "soma", "nota": "0 = quase nunca · 1 = algumas vezes · 2 = quase sempre.", "cortes": [[0, 3, "Disfunção familiar acentuada", "critico"], [4, 6, "Disfunção familiar moderada", "alto"], [7, 10, "Boa funcionalidade familiar", "ok"]], "conduta": {"ok": "7–10: família funcional — recurso importante no plano de cuidados.", "alto": "4–6: disfunção moderada — mapear a rede de apoio real, identificar o cuidador principal e sua sobrecarga (Zarit), acionar serviço social.", "critico": "0–3: disfunção ], [2, 2, "Dispneia moderada", "medio"], [3, 4, "Dispneia grave", "alto"]], "conduta": {"ok": "0–1: pouca limitação — manter atividade física.", "medio": "2: limitação relevante. Na DPOC, mMRC ≥2 já indica grupo sintomático — otimizar broncodilatação e indicar reabilitação pulmonar.", "alto": "3–4: limitação grave. Reabilitação pulmonar, avaliar oxigenoterapia, rastrear insuficiência cardíaca, anemia, sarcopenia e depressão. Discutir metas de cuidado e planejar suporte domiciliar."}, "fonte": "Acervo: 12 obras", "extra": [], "nota": ""}, {"id": "sensorial", "nome": "Rastreio Sensorial — visão e audição", "sigla": "Visão/Audição", "dominio": "Outros", "avalia": "Rastreio combinado de acuidade visual (Snellen) e audição (teste da voz sussurrada) — os dois déficits sensoriais mais associados a queda, delirium, isolamento e demência.", "tempo": "5 min", "faixa": [0, 6], "sentido": "maior_pior", "calc": "soma", "nota": "Voz sussurrada: posicione-se a 60 cm ATRÁS do paciente, oclua e friccione o canal auditivo contralateral, expire completamente e sussurre 3 números ou letras. Repetir com uma sequência diferente se errar.", "itens": [{"t": "VISÃO — “Você tem dificuldade para enxergar, mesmo de óculos, que atrapalhe alguma atividade do dia a dia?”", "o": [["Não", 0], ["Sim", 1]]}, {"t": "VISÃO — Acuidade na tabela de Snellen (com a correção habitual)", "o": [["Melhor que 20/40", 0], ["20/40 a 20/60", 1], ["Pior que 20/60", 2]]}, {"t": "AUDIÇÃO — “Você tem dificuldade para ouvir que atrapalhe alguma atividade do dia a dia?”", "o": [["Não", 0], ["Sim", 1]]}, {"t": "AUDIÇÃO — Teste da voz sussurrada", "o": [["Acerta todos os números", 0], ["Erra até metade", 1], ["Erra mais da metade", 2]]}], "cortes": [[0, 0, "Sem déficit sensorial detectado", "ok"], [1, 2, "Déficit sensorial leve", "medio"], [3, 6, "Déficit sensorial significativo", "alto"]], "conduta": {"ok": "Sem déficit no rastreio — repetir anualmente.", "medio": "Déficit leve — inspecionar o canal auditivo (cerume impactado é causa comum e reversível), revisar a correção óptica e reavaliar em 6 meses.", "alto": "Déficit significativo. Encaminhar para oftalmologia (catarata, glaucoma, DMRI) e otorrinolaringologia/fonoaudiologia. Corrigir visão reduz quedas; corrigir audição melhora comunicação, humor e participação social e é intervenção reconhecida na prevenção de demência. Adaptar a comunicação na consulta: falar de frente, devagar, sem gritar."}, "fonte": "Acervo: Snellen 12 obras · voz sussurrada 3 obras · HHIE 15 obras", "extra": []}, {"id": "cam_icu", "nome": "Método de Avaliação da Confusão para a UTI", "sigla": "CAM-ICU", "dominio": "Delirium", "avalia": "Diagnóstico de delirium em pacientes críticos, inclusive intubados — usa testes não verbais de atenção.", "tempo": "3 min", "faixa": [0, 4], "sentido": "maior_pior", "calc": "cam", "nota": "Pré-requisito: RASS ≥ −3. Se RASS for −4 ou −5, o paciente é considerado NÃO AVALIÁVEL — reavaliar depois. Teste de atenção (ASE letras): dizer “A-B-A-D-B-A-D-A-A-Y” e pedir que aperte a mão a cada letra A; erro é não apertar no A ou apertar em outra letra.", "itens": [{"t": "1. INÍCIO AGUDO OU CURSO FLUTUANTE — mudança do estado mental basal nas últimas 24 h, ou flutuação do RASS/nível de consciência", "o": [["Ausente", 0], ["Presente", 1]]}, {"t": "2. DESATENÇÃO — teste das 10 letras (ASE): mais de 2 erros indica desatenção", "o": [["≤2 erros (ausente)", 0], [">2 erros (presente)", 1]]}, {"t": "3. PENSAMENTO DESORGANIZADO — 4 perguntas simples (uma pedra flutua na água? há peixes no mar? 1 kg pesa mais que 2 kg? usa-se martelo para bater prego?) + comando de 2 etapas; mais de 1 erro indica alteração", "o": [["≤1 erro (ausente)", 0], [">1 erro (presente)", 1]]}, {"t": "4. NÍVEL DE CONSCIÊNCIA ALTERADO — RASS diferente de zero", "o": [["RASS = 0 (ausente)", 0], ["RASS ≠ 0 (presente)", 1]]}], "conduta": {"critico": "CAM-ICU POSITIVO — delirium em paciente crítico, associado a maior mortalidade, tempo de ventilação e declínio cognitivo tardio. Aplicar o pacote ABCDEF: avaliar e tratar dor; despertar diário e teste de respiração espontânea; escolher sedação evitando benzodiazepínicos (preferir dexmedetomidina ou propofol); monitorar delirium; mobilização precoce; envolvimento da família. Corrigir causas: sepse, hipóxia, distúrbio metabólico, abstinência, retenção urinária, constipação.", "ok": "CAM-ICU negativo. Manter rastreio a cada turno — o delirium é flutuante e o subtipo hipoativo passa despercebido."}, "fonte": "Acervo: 38 obras", "cortes": [], "extra": []}, {"id": "icdsc", "nome": "Checklist de Rastreio de Delirium em Terapia Intensiva", "sigla": "ICDSC", "dominio": "Delirium", "avalia": "Rastreio de delirium em UTI com base na observação das últimas 24 h — não exige colaboração ativa contínua do paciente.", "tempo": "3 min", "faixa": [0, 8], "sentido": "maior_pior", "calc": "soma", "nota": "1 ponto para cada item presente em qualquer momento nas últimas 24 h. Não avaliável em coma profundo.", "itens": [{"t": "1. Nível de consciência alterado (hipervigilância, letargia ou necessidade de estímulo vigoroso)", "o": [["Não", 0], ["Sim", 1]]}, {"t": "2. Desatenção — dificuldade em seguir instruções ou de se manter na conversa", "o": [["Não", 0], ["Sim", 1]]}, {"t": "3. Desorientação — em tempo, espaço ou pessoa", "o": [["Não", 0], ["Sim", 1]]}, {"t": "4. Alucinação ou delírio — manifestação clínica de psicose", "o": [["Não", 0], ["Sim", 1]]}, {"t": "5. Agitação psicomotora ou retardo — hiperatividade que exige contenção/sedativo, ou lentificação evidente", "o": [["Não", 0], ["Sim", 1]]}, {"t": "6. Fala ou humor inapropriados — discurso incoerente, apatia ou emotividade desproporcional", "o": [["Não", 0], ["Sim", 1]]}, {"t": "7. Distúrbio do ciclo sono-vigília — dormir menos de 4 h à noite ou dormir a maior parte do dia", "o": [["Não", 0], ["Sim", 1]]}, {"t": "8. Flutuação dos sintomas — qualquer dos itens acima variando ao longo das 24 h", "o": [["Não", 0], ["Sim", 1]]}], "cortes": [[0, 0, "Sem d : 1, "nome": "Colchicina", "classe": "Antigotoso"}, {"pt": 1, "nome": "Prednisona", "classe": "Corticoide"}, {"pt": 1, "nome": "Hidrocortisona", "classe": "Corticoide"}, {"pt": 1, "nome": "Teofilina", "classe": "Broncodilatador"}, {"pt": 1, "nome": "Haloperidol", "classe": "Antipsicótico típico"}, {"pt": 1, "nome": "Risperidona", "classe": "Antipsicótico atípico"}], "fonte": "Escala ACB · critérios de Beers 2023 (Tabelas 2, 3 e 7), presentes no acervo"}, {"id": "t_beers", "sigla": "Beers 2023", "nome": "Critérios de Beers da AGS — 2023", "dominio": "Farmacoterapia", "tipo": "lista", "tempo": "consulta", "avalia": "Medicamentos potencialmente inapropriados no idoso, organizados por categoria, por doença, por interação e por função renal.", "nota": "Busque pelo nome do medicamento, pela doença ou pela classe. Os critérios orientam a decisão — não proíbem: o uso pode ser justificado quando o benefício supera o risco e isso é discutido com o paciente.", "dados": [{"cat": "Anti-histamínicos", "farmaco": "Anti-histamínicos de 1ª geração — difenidramina, dexclorfeniramina, prometazina, hidroxizina, dimenidrinato, meclizina, ciproeptadina, doxilamina", "rec": "EVITAR", "motivo": "Fortemente anticolinérgicos; clearance reduzido com a idade e tolerância rápida como hipnótico. Risco de confusão, boca seca, constipação, retenção urinária, queda, delirium e demência. Exceção possível: difenidramina em reação alérgica grave aguda.", "tab": "Tabela 2"}, {"cat": "Anti-infecciosos", "farmaco": "Nitrofurantoína", "rec": "EVITAR se clearance de creatinina <30 mL/min ou para supressão de longo prazo", "motivo": "Toxicidade pulmonar, hepatotoxicidade e neuropatia periférica, sobretudo com uso prolongado. Há alternativas mais seguras.", "tab": "Tabela 2"}, {"cat": "Cardiovascular", "farmaco": "Ácido acetilsalicílico para PREVENÇÃO PRIMÁRIA de doença cardiovascular", "rec": "EVITAR iniciar; considerar desprescrever em quem já usa", "motivo": "O risco de sangramento maior cresce acentuadamente com a idade e os estudos mostram ausência de benefício líquido e potencial de dano quando iniciado como prevenção primária no idoso. Segue indicado na prevenção secundária.", "tab": "Tabela 2"}, {"cat": "Cardiovascular", "farmaco": "Varfarina para fibrilação atrial não valvar ou tromboembolismo venoso", "rec": "EVITAR como terapia inicial", "motivo": "Comparada aos anticoagulantes orais diretos, tem maior risco de sangramento maior, sobretudo intracraniano, com eficácia igual ou menor. Em quem já usa há muito tempo, com INR bem controlado (>70% do tempo na faixa) e sem eventos, pode ser razoável manter.", "tab": "Tabela 2"}, {"cat": "Cardiovascular", "farmaco": "Rivaroxabana para tratamento de longo prazo de fibrilação atrial ou TEV", "rec": "EVITAR em favor de alternativas mais seguras", "motivo": "Maior risco de sangramento maior e digestivo em idosos que os demais anticoagulantes diretos, em especial a apixabana. Pode ser razoável quando a dose única diária for essencial para a adesão.", "tab": "Tabela 2"}, {"cat": "Cardiovascular", "farmaco": "Alfabloqueadores periféricos para hipertensão — doxazosina, prazosina, terazosina", "rec": "EVITAR como anti-hipertensivo", "motivo": "Alto risco de hipotensão ortostática e de suas consequências. Não são tratamento de rotina da hipertensão.", "tab": "Tabela 2"}, {"cat": "Cardiovascular", "farmaco": "Alfa-agonistas centrais — clonidina, guanfacina, metildopa", "rec": "EVITAR como primeira linha para hipertensão", "motivo": "Alto risco de efeitos adversos no sistema nervoso central, bradicardia e hipotensão ortostática.", "tab": "Tabela 2"}, {"cat": "Cardiovascular", "farmaco": "Nifedipino de liberação imediata", "rec": "EVITAR", "motivo": "Risco de hipotensão e de precipitar isquemia miocárdica.", "tab": "Tabela 2"}, {"cat": "Cardiovascular", "farmaco": "Amiodarona", "rec": "EVITAR como primeira linha na fibrilação atrial", "motivo": "Eficaz para manter ritmo sinusal, mas com toxicidade maior que a de outros antiarrítmicos. Pode ser razoável em primeira linha se houver insuficiência cardíaca ou hipertrofia ventricular importante.", "tab": "Tabela 2"}, {"cat": "Cardiovascular", "farmaco": "Digoxina", "rec": "EVITAR como primeira linha na fibrilação atrial e na insuficiência cardíaca; se usar, não passar de 0,125 mg/dia", "motivo": "Há alternativas mais seguras e efetivas para controle de frequência. Doses maiores não trazem benefício adicional e aumentam o risco de toxicidade, agravado pela redução da depuração renal.", "tab": "Tabela 2"}, {"cat": "Sistema nervoso central", "farmaco": "Antidepressivos com forte ação anticolinérgica — amitriptilina, clomipramina, imipramina, nortriptilina, doxepina >6 mg/dia, paroxetina, amoxapina, desipramina", "rec": "EVITAR", "motivo": "Fortemente anticolinérgicos, sedativos e causadores de hipotensão ortostática.", "tab": "Tabela 2"}, {"cat": "Sistema nervoso central", "farmaco": "Antiparkinsonianos anticolinérgicos — biperideno, triexifenidil, benztropina", "rec": "EVITAR", "motivo": "Não recomendados para prevenir ou tratar sintomas extrapiramidais de antipsicóticos; há agentes mais efetivos para a doença de Parkinson.", "tab": "Tabela 2"}, {"cat": "Sistema nervoso central", "farmaco": "Antipsicóticos de 1ª e 2ª geração", "rec": "EVITAR, exceto em indicações aprovadas (esquizofrenia, transtorno bipolar, psicose da doença de Parkinson, adjuvante em depressão maior, antiemético de curta duração)", "motivo": "Aumento do risco de AVC, de declínio cognitivo e de mortalidade em pessoas com demência. Para sintomas comportamentais da demência ou delirium, usar apenas se as medidas não farmacológicas documentadamente falharam ou se há ameaça de dano substancial. Se usado, tentar desprescrever periodicamente.", "tab": "Tabela 2"}, {"cat": "Sistema nervoso central", "farmaco": "Barbitúricos — fenobarbital, primidona, butalbital", "rec": "EVITAR", "motivo": "Alta taxa de dependência física, tolerância ao efeito sobre o sono e risco de superdose com doses baixas.", "tab": "Tabela 2"}, {"cat": "Sistema nervoso central", "farmaco": "Benzodiazepínicos — todos (alprazolam, clonazepam, diazepam, lorazepam, midazolam e outros)", "rec": "EVITAR", "motivo": "Idosos têm sensibilidade aumentada e metabolismo reduzido. Aumentam risco de comprometimento cognitivo, delirium, queda, fratura e acidente automobilístico. Uso com opioide pode causar sedação profunda, depressão respiratória e morte. Pode ser apropriado em crise convulsiva, transtorno comportamental do sono REM, abstinência de álcool ou de benzodiazepínico, ansiedade generalizada grave e sedação periprocedimento.", "tab": "Tabela 2"}, {"cat": "Sistema nervoso central", "farmaco": "Hipnóticos “Z” — zolpidem, zopiclona, eszopiclona, zaleplona", "rec": "EVITAR", "motivo": "Eventos adversos semelhantes aos dos benzodiazepínicos — delirium, queda, fratura, ida à emergência e acidente automobilístico — com melhora mínima da latência e da duração do sono.", "tab": "Tabela 2"}, {"cat": "Endócrino", "farmaco": "Estrogênio sistêmico com ou sem progestágeno", "rec": "NÃO INICIAR por via oral ou transdérmica; considerar desprescrever", "motivo": "Potencial carcinogênico (mama e endométrio), ausência de cardioproteção e de proteção cognitiva. Estrogênio vaginal em dose baixa é aceitável para dispareunia, infecção urinária recorrente e outros sintomas vaginais.", "tab": "Tabela 2"}, {"cat": "Endócrino", "farmaco": "Insulina em esquema de escala móvel isolada", "rec": "EVITAR", "motivo": "Maior risco de hipoglicemia sem melhora do controle glicêmico, em qualquer cenário de cuidado. Não se aplica a esquemas que incluam insulina basal.", "tab": "Tabela 2"}, {"cat": "Endócrino", "farmaco": "Sulfonilureias — glibenclamida, glimepirida, gliclazida, glipizida", "rec": "EVITAR como monoterapia de primeira ou segunda linha; se usar, prefira as de ação curta", "motivo": "Maior risco de hipoglicemia, de eventos cardiovasculares e de mortalidade que as alternativas. As de ação longa (glibenclamida, glimepirida) causam hipoglicemia prolongada com mais frequência.", "tab": "Tabela 2"}, {"cat": "Endócrino", "farmaco": "Megestrol", "rec": "EVITAR", "motivo": "Efeito mínimo sobre o peso e aumento do risco de eventos trombóticos e possivelmente de morte.", "tab": "Tabela 2"}, {"cat": "Endócrino", "farmaco": "Androgênios — testosterona, metiltestosterona", "rec": "EVITAR, salvo hipogonadismo confirmado e sintomático", "motivo": "Potencial de problemas cardíacos e risco em homens com câncer de próstata.", "tab": "Tabela 2"}, {"cat": "Gastrointestinal", "farmaco": "Inibidores da bomba de prótons — omeprazol, pantoprazol, esomeprazol e outros", "rec": "EVITAR uso programado por mais de 8 semanas, salvo indicação específica", "motivo": "Risco de infecção por C. difficile, pneumonia, perda óssea e fratura. Exceções: uso crônico de corticoide ou anti-inflamatório, esofagite erosiva, esôfago de Barrett, condição hipersecretora ou necessidade demonstrada de manutenção.", "tab": "Tabela 2"}, {"cat": "Gastrointestinal", "farmaco": "Metoclopramida", "rec": "EVITAR, exceto na gastroparesia por até 12 semanas", "motivo": "Pode causar efeitos extrapiramidais, inclusive discinesia tardia, com risco maior no idoso frágil e no uso prolongado.", "tab": "Tabela 2"}, {"cat": "Gastrointestinal", "farmaco": "Antiespasmódicos anticolinérgicos — escopolamina, butilescopolamina, diciclomina, atropina", "rec": "EVITAR", "motivo": "Fortemente anticolinérgicos e de efetividade incerta.", "tab": "Tabela 2"}, {"cat": "Gastrointestinal", "farmaco": "Óleo mineral por via oral", "rec": "EVITAR", "motivo": "Risco de aspiração e de efeitos adversos; há alternativas mais seguras.", "tab": "Tabela 2"}, {"cat": "Geniturinário", "farmaco": "Desmopressina", "rec": "EVITAR para noctúria ou poliúria noturna", "motivo": "Alto risco de hiponatremia, com alternativas mais seguras, inclusive não farmacológicas.", "tab": "Tabela 2"}, {"cat": "Dor", "farmaco": "Anti-inflamatórios não esteroidais orais não se   iqcode(sc){ const v=vals(sc).filter(x=>typeof x==='number'); if(!v.length) return {n:0,txt:'—',lab:'',cls:'neutro'};

  phq9(sc){ const n=soma(sc); return {n, txt:n, ...(faixa(sc,n)||{})}; },

  esas(sc){ const n=soma(sc), v=vals(sc).map(x=>typeof x==='number'?x:0);

  hei(sc){ const v=vals(sc)[0]; if(typeof v!=='number') return {n:0,txt:'—',lab:'',cls:'neutro'};

  frailty_index(sc){ const d=soma(sc), tot=sc.itens.length, fi=R(d/tot);

  adcs(sc){ const v=vals(sc)[0]; if(typeof v!=='number') return {n:0,txt:'—',lab:'',cls:'neutro'};
    const cls = v>60?'ok': v>=40?'medio':'alto';
    return {n:v, txt:v+'/78', cls, lab: v>60?'Funcionalidade preservada': v>=40?'Perda funcional moderada':'Perda funcional acentuada'}; },
  bpi(sc){ const v=vals(sc); const num=x=>typeof x==='number'?x:null;

    if(!int.length||!itf.length) return {n:0,txt:'—',lab:'',cls:'neutro'};

  psqi(sc){ const v=vals(sc);

    let cama = levantar - deitar; if(cama<0) cama+=24;

CALC.acer = CALC.soma; CALC.fast = CALC.soma; CALC.psi = CALC.soma;

function resultado(sc){
  const r=(CALC[sc.calc]||CALC.soma)(sc);
  r.cls=r.cls||'neutro'; r.lab=r.lab||''; return r;
}
const SEM_MAX = {marcha:1,tug:1,sts:1,panturrilha:1,iqcode:1,fluencia:1,dad:1,asg:1,cam:1,hads:1,charlson:1,demmi:1,alcance:1,unipodal:1,dinamo:1,imc:1,hei:1,frailty_index:1,adcs:1,bpi:1,psqi:1,cirsg:1,hhie:1,eq5d:1,mif:1,mcgill:1};
function prontuario(sc){
  const r=resultado(sc);
  if(!completo(sc)) return '';
  let t = sc.nome + ' (' + sc.sigla + '): ' + r.txt;
  if(sc.faixa && !SEM_MAX[sc.calc]) t += ' de ' + sc.faixa[1];
  t += (r.lab? ' — ' + r.lab : '') + '.';
  const cond=(sc.conduta||{})[r.cls];
  if(cond) t += ' Conduta: ' + cond;
  return t;
}

function renderList(){
  const q=($('#q').value||'').toLowerCase().trim();
  const arr=S.filter(s=>!q||(s.sigla+' '+s.nome+' '+s.dominio+' '+s.avalia).toLowerCase().includes(q));
  let h='';
  const fer=FER.filter(s=>!q||(s.sigla+' '+s.nome+' '+s.avalia).toLowerCase().includes(q));
  DB.dominios.forEach(d=>{
    const g=arr.filter(s=>s.dominio===d);
    const gf=fer.filter(s=>s.dominio===d);
    if(!g.length && !gf.length) return;
    h+='<div class="dom"><span>'+d+'</span><span class="n">'+(g.length+gf.length)+'</span></div>';
    gf.forEach(s=>{ h+='<button class="si tool'+(s.id===state.sel?' on':'')+'" data-id="'+s.id+'"><b>'+esc(s.sigla)+'</b><span>'+esc(s.nome)+'</span></button>'; });
    g.forEach(s=>{ h+='<button class="si'+(s.id===state.sel?' on':'')+(state.sess[s.id]?' done':'')+'" data-id="'+s.id+'"><b>'+esc(s.sigla)+'</b><span>'+esc(s.nome)+'</span></button>'; });
  });
  $('#list').innerHTML = h || '<div class="vazio">nenhuma escala encontrada</div>';
  $('#list').querySelectorAll('.si').forEach(b=> b.onclick=()=>{
    state.sel=b.dataset.id; state.view='app'; state.expand=false;
    document.body.classList.remove('nav'); render(); $('#work').scrollTop=0; });
}

function renderScale(){
  const sc=byId(state.sel), r=resultado(sc), comp=completo(sc), resp=state.resp[sc.id]||{};
  let h='<div class="head"><h2>'+esc(sc.nome)+'</h2><div class="meta"><span class="chip">'+esc(sc.sigla)+'</span><span class="chip">'+esc(sc.dominio)+'</span><span class="chip">'+esc(sc.tempo)+'</span></div></div>';
  h+='<p class="avalia">'+esc(sc.avalia)+'</p>';
  if(sc.nota) h+='<div class="nota">'+esc(sc.nota)+'</div>';
  if(sc.extra.length){
    h+='<div class="extra">';
    sc.extra.forEach(e=>{
      h+='<div><label>'+esc(e.label)+'</label><select data-ex="'+e.campo+'"><option value="">— selecione —</option>';
      e.opcoes.forEach(o=>{ h+='<option value="'+o[1]+'"'+(ex(sc,e.campo)===o[1]?' selected':'')+'>'+esc(o[0])+'</option>'; });
      h+='</select></div>';
    });
    h+='</div>';
  }
  sc.itens.forEach(function(it,i){
    h+='<div class="item"><div class="q"><i>'+(sc.itens.length>1?(i+1)+'.':'')+'</i>'+esc(it.t)+'</div>';
    if(it.num){
      h+='<input class="numin" type="number" inputmode="decimal" step="'+it.step+'" min="'+it.min+'" max="'+it.max+'" data-i="'+i+'" value="'+(resp[i]!==undefined?resp[i]:'')+'"> <span style="color:var(--dim)">'+esc(it.unidade||'')+'</span>';
    } else {
      h+='<div class="opts">';
      it.o.forEach(function(o){ h+='<button class="opt'+(resp[i]===o[1]?' on':'')+'" data-i="'+i+'" data-v="'+o[1]+'">'+esc(o[0])+'</button>'; });
      h+='</div>';
    }
    h+='</div>';
  });
  if(sc.alerta_item && resp[sc.alerta_item.idx]>=sc.alerta_item.min)
    h+='<div class="alerta">'+esc(sc.alerta_item.texto)+'</div>';
  h+='<div class="fonte">Fonte no acervo: '+esc(sc.fonte)+'</div>';

  const pct = sc.faixa ? Math.max(0,Math.min(100, ((r.n - sc.faixa[0])/(sc.faixa[1]-sc.faixa[0]))*100)) : 0;
  h+='<div class="res"><div class="score"><span class="n '+r.cls+'">'+esc(String(r.txt))+'</span>';
  if(r.lab) h+='<span class="lab '+r.cls+'">'+esc(r.lab)+'</span>';
  if(!comp) h+='<span class="max">'+vals(sc).filter(v=>typeof v==='number').length+'/'+sc.itens.length+' itens</span>';
  h+='</div><div class="bar"><i class="'+r.cls+'" style="width:'+pct+'%"></i></div>';
  const cond=(sc.conduta||{})[r.cls];
  if(cond && comp) h+='<div class="conduta '+r.cls+(MOB()&&!state.expand?' dobra':'')+'" id="cond">'+esc(cond)+'</div>';
  h+='<div class="acts"><button class="btn p" id="copiar">Copiar para o prontuário</button>'
   + '<button class="btn" id="salvar">Salvar na sessão</button><button class="btn" id="limpar">Limpar</button></div></div>';
  $('#work').innerHTML=h;

  $('#work').querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){
    state.resp[sc.id]=state.resp[sc.id]||{};
    const i=+b.dataset.i, v=parseFloat(b.dataset.v);
    state.resp[sc.id][i] = (state.resp[sc.id][i]===v ? undefined : v);
    const y=$('#work').scrollTop; renderScale(); $('#work').scrollTop=y;
  };});
  $('#work').querySelectorAll('.numin').forEach(function(inp){ inp.oninput=function(){
    state.resp[sc.id]=state.resp[sc.id]||{};
    const v=parseFloat(inp.value);
    state.resp[sc.id][+inp.dataset.i]= isNaN(v)? undefined : v;
    const y=$('#work').scrollTop, pos=inp.selectionStart; renderScale(); $('#work').scrollTop=y;
    const ni=$('#work').querySelector('.numin[data-i="'+inp.dataset.i+'"]');
    if(ni){ ni.focus(); try{ni.setSelectionRange(pos,pos)}catch(e){} }
  };});
  $('#work').querySelectorAll('select[data-ex]').forEach(function(sel){ sel.onchange=function(){
    state.extras[sc.id]=state.extras[sc.id]||{};
    state.extras[sc.id][sel.dataset.ex]= sel.value||undefined;
    const y=$('#work').scrollTop; renderScale(); $('#work').scrollTop=y;
  };});
  const cd=$('#cond'); if(cd) cd.onclick=function(){ state.expand=!state.expand; renderScale(); };
  $('#copiar').onclick=function(){ copiar(prontuario(sc)||('Escala '+sc.sigla+' — preenchimento incompleto.')); salvar(sc); };
  $('#salvar').onclick=function(){ salvar(sc); toast(completo(sc)?'salvo na sessão':'preencha todos os itens'); };
  $('#limpar').onclick=function(){ state.resp[sc.id]={}; state.extras[sc.id]={}; delete state.sess[sc.id]; render(); };
}

function salvar(sc){
  if(!completo(sc)) return;
  const r=resultado(sc);
  state.sess[sc.id]={sigla:sc.sigla, nome:sc.nome, txt:r.txt, lab:r.lab, cls:r.cls, linha:prontuario(sc)};
  renderList(); contaSess();
}
function contaSess(){ const n=Object.keys(state.sess).length; $('#nsess').textContent = n? '('+n+')':''; }

function renderTool(){
  const t=ferById(state.sel);
  let h='<div class="head"><h2>'+esc(t.nome)+'</h2><div class="meta"><span class="chip">'+esc(t.sigla)+'</span><span class="chip">'+esc(t.dominio)+'</span><span class="chip">'+esc(t.tempo)+'</span></div></div>';
  h+='<p class="avalia">'+esc(t.avalia)+'</p>';
  if(t.nota) h+='<div class="nota">'+esc(t.nota)+'</div>';
  h+='<div class="search" style="padding:0;margin:14px 0"><input id="fq" placeholder="'+(t.tipo==='acb'?'Buscar medicamento ou classe…':'Buscar medicamento, doença ou classe…')+'" value="'+esc(state.fq)+'" autocomplete="off"></div>';
  const q=(state.fq||'').toLowerCase().trim();

  if(t.tipo==='acb'){
    const sel=Object.keys(state.acb).filter(k=>state.acb[k]);
    const total=sel.reduce((a,k)=>a+Number(k.split('|')[1]),0);
    if(sel.length){ h+='<div style="margin:6px 0 14px">'+sel.map(k=>'<span class="pill" data-rm="'+esc(k)+'">'+esc(k.split('|')[0])+' · '+k.split('|')[1]+' ✕</span>').join('')+'</div>'; }
    const lista=t.dados.filter(d=>!q||(d.nome+' '+d.classe).toLowerCase().includes(q));
    h+='<div>'+lista.map(d=>{
      const key=d.nome+'|'+d.pt;
      return '<div class="drug'+(state.acb[key]?' on':'')+'" data-k="'+esc(key)+'"><span class="pt">'+d.pt+'</span><span class="nm">'+esc(d.nome)+'</span><span class="cl">'+esc(d.classe)+'</span></div>';
    }).join('')+'</div>';
    h+='<div class="fonte">Fonte no acervo: '+esc(t.fonte)+'</div>';
    const cls = total>=3?'critico': total>=1?'alto':'ok';
    const lab = total>=3?'Carga anticolinérgica clinicamente relevante': total>=1?'Carga anticolinérgica presente':'Sem carga anticolinérgica';
    const cond = total>=3
      ? 'Escore ACB de 3 ou mais associa-se a declínio cognitivo, delirium, queda e maior mortalidade, e o risco aumenta a cada ponto. Reveja um a um: substitua anti-histamínico de 1ª geração por um de 2ª, oxibutinina por mirabegrona, amitriptilina por duloxetina ou gabapentinoide, e questione a indicação de antipsicótico e de antiespasmódico. Retire um fármaco por vez e reavalie cognição e função em 2 a 4 semanas.'
      : total>=1 ? 'Carga baixa, mas presente. Vale conferir se cada um desses medicamentos ainda tem indicação — a soma cresce silenciosamente a cada nova prescrição.'
      : 'Nenhum fármaco anticolinérgico identificado entre os selecionados. Repita a conta a cada mudança de prescrição.';
    h+='<div class="res"><div class="score"><span class="n '+cls+'">'+total+'</span><span class="lab '+cls+'">'+lab+'</span>';
    h+='<span class="max">'+sel.length+' medicamento(s)</span></div>';
    h+='<div class="bar"><i class="'+cls+'" style="width:'+Math.min(100,total*14)+'%"></i></div>';
    h+='<div class="conduta '+cls+'">'+esc(cond)+'</div>';
    h+='<div class="acts"><button class="btn p" id="copiarT">Copiar para o prontuário</button><button class="btn" id="limparT">Limpar</button></div></div>';
    $('#work').innerHTML=h;
    $('#work').querySelectorAll('.drug').forEach(function(el){ el.onclick=function(){
      const k=el.dataset.k; state.acb[k]=!state.acb[k];
      const y=$('#work').scrollTop; renderTool(); $('#work').scrollTop=y; };});
    $('#work').querySelectorAll('.pill').forEach(function(el){ el.onclick=function(){
      delete state.acb[el.dataset.rm]; renderTool(); };});
    $('#limparT').onclick=function(){ state.acb={}; renderTool(); };
    $('#copiarT').onclick=function(){
      const txt='Carga anticolinérgica (ACB): '+total+' ponto(s) — '+lab+'. Medicamentos considerados: '
        + (sel.length? sel.map(k=>k.split('|')[0]+' ('+k.split('|')[1]+')').join(', ') : 'nenhum')
        + '. Conduta: '+cond;
      copiar(txt); };
  } else {
    const cats=[]; t.dados.forEach(function(d){ if(cats.indexOf(d.cat)<0) cats.push(d.cat); });
    if(!(MOB() && q)) h+='<div class="filtro"><button class="'+(!state.fcat?'on':'')+'" data-c="">Todos</button>'
      + cats.map(c=>'<button class="'+(state.fcat===c?'on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>';
    else h+='<div style="height:6px"></div>';
    const lista=t.dados.filter(function(d){
      if(state.fcat && d.cat!==state.fcat) return false;
      const blob=(d.cat+' '+(d.farmaco||'')+' '+(d.texto||'')+' '+(d.motivo||'')+' '+(d.rec||'')).toLowerCase();
      return !q || blob.includes(q);
    });
    h+='<div style="color:var(--dim);font-size:13px;margin-bottom:4px">'+lista.length+' de '+t.dados.length+' critérios</div>';
    h+=lista.map(function(d){
      if(d.texto!==undefined){
        const kind = d.tipo==='START'?'start':'evitar';
        return '<div class="crit"><span class="rec '+kind+'">'+d.tipo+'</span><div class="fx">'+esc(d.texto)+'</div><div class="tg">'+esc(d.cat)+'</div></div>';
      }
      const kind = d.rec.indexOf('EVITAR')===0?'evitar':'cautela';
      return '<div class="crit"><span class="rec '+kind+'">'+esc(d.rec.split(',')[0].slice(0,60))+'</span><div class="fx">'+esc(d.farmaco)+'</div><div class="mt">'+esc(d.motivo)+'</div><div class="tg">'+esc(d.cat)+' · '+esc(d.tab)+'</div></div>';
    }).join('');
    h+='<div class="fonte">Fonte no acervo: '+esc(t.fonte)+'</div>';
    $('#work').innerHTML=h;
    $('#work').querySelectorAll('.filtro button').forEach(function(el){ el.onclick=function(){
      state.fcat=el.dataset.c||null; renderTool(); };});
  }
  const fq=$('#fq');
  if(fq) fq.oninput=function(){ const p=fq.selectionStart; state.fq=fq.value; renderTool();
    const n2=$('#fq'); if(n2){ n2.focus(); try{n2.setSelectionRange(p,p)}catch(e){} } };
}

function renderSess(){
  const ks=Object.keys(state.sess);
  let h='<div class="head"><h2>Sessão de avaliação</h2><div class="meta">Escalas aplicadas neste atendimento. O texto abaixo já sai pronto para colar na evolução.</div></div>';
  if(!ks.length){ h+='<div class="vazio">Nenhuma escala aplicada ainda. Preencha uma escala na aba <b>Aplicar</b> e toque em “Salvar na sessão” — os resultados se acumulam aqui e viram um único texto de evolução.</div>'; $('#work').innerHTML=h; return; }
  h+='<div class="sess">';
  ks.forEach(function(k){ const s=state.sess[k];
    h+='<div class="card"><span class="v '+s.cls+'">'+esc(String(s.txt))+'</span><b>'+esc(s.sigla)+'</b><br><span style="color:var(--dim);font-size:13px">'+esc(s.nome)+(s.lab?' — '+esc(s.lab):'')+'</span></div>'; });
  const texto='AVALIAÇÃO GERIÁTRICA — ESCALAS APLICADAS\n\n'+ks.map(function(k){return '• '+state.sess[k].linha;}).join('\n\n');
  h+='<div class="acts" style="margin:16px 0 10px"><button class="btn p" id="copiaTudo">Copiar evolução completa</button><button class="btn" id="limpaSess">Limpar sessão</button><button class="btn" id="imprime">Imprimir</button></div>';
  h+='<textarea id="txt">'+esc(texto)+'</textarea></div>';
  $('#work').innerHTML=h;
  $('#copiaTudo').onclick=function(){ copiar($('#txt').value); };
  $('#limpaSess').onclick=function(){ state.sess={}; render(); };
  $('#imprime').onclick=function(){ window.print(); };
}

function copiar(t){
  const ok=function(){ toast('copiado'); };
  const fallback=function(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); try{ta.setSelectionRange(0,t.length);}catch(e){}
    try{ document.execCommand('copy'); ok(); }catch(e){ toast('selecione e copie'); } ta.remove(); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok).catch(function(){fallback(t);});
  else fallback(t);
}
let tt; function toast(m){ const e=$('#toast'); e.textContent=m; e.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){e.classList.remove('on');},1500); }

function render(){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.v===state.view); });
  const side=$('#side');
  if(state.view==='ses'){ side.style.display='none'; document.body.classList.remove('nav'); }
  else side.style.display='flex';
  if(state.view==='app'){ renderList(); if(ferById(state.sel)) renderTool(); else renderScale(); }
  else renderSess();
  contaSess();
}
document.querySelectorAll('.tab').forEach(function(t){ t.onclick=function(){ state.view=t.dataset.v; document.body.classList.remove('nav'); render(); }; });
$('#menu').onclick=function(){ document.body.classList.toggle('nav'); };
$('#q').addEventListener('input', function(){ renderList(); });
window.addEventListener('resize', function(){ if(!MOB()) document.body.classList.remove('nav'); });
const hh=()=>document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight+'px');
hh(); addEventListener('resize', hh); addEventListener('orientationchange', ()=>setTimeout(hh,120));
render();
</script></body></html>
